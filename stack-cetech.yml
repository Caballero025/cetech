version: '3.8'

networks:
  cetech_net:
    driver: overlay

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: cetech
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    networks:
      - cetech_net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == manager
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    networks:
      - cetech_net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == manager
    volumes:
      - redis_data:/data

  app:
    image: caballero26/cetech:latest
    deploy:
      replicas: 2
      placement:
        constraints:
          - node.role == worker
    ports:
      - "8000:8000"
    environment:
      # Variables esenciales
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: cetech
      DB_USERNAME: postgres
      
      # Session y Cache
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SESSION_LIFETIME: "120"
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
      
      # App config
      APP_ENV: production
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      LOG_CHANNEL: stderr
      
      # APP_KEY se cargará desde el entrypoint
    secrets:
      - db_password
      - app_key
    networks:
      - cetech_net
    depends_on:
      - db
      - redis
    # EL ENTRYPOINT ES CRÍTICO - NO USAR COMMAND
    entrypoint: ["/usr/local/bin/docker-entrypoint.sh"]

secrets:
  db_password:
    external: true
  app_key:
    external: true

volumes:
  db_data:
  redis_data: